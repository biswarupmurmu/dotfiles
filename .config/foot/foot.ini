[main]
title=foot
locked-title=yes
font=FiraCode Nerd Font:pixelsize=28

[tweak]
grapheme-shaping=yes
grapheme-width-method=double-width


[colors-dark]
## Cyber-Void - Pure Dark with High-Vibrancy Neon
background=000000 #000000
foreground=ffffff #ffffff

# Regular colors (Rich, Saturated Base)
regular0=1a1a1a #1a1a1a
regular1=ff3366 #ff3366 (Electric Rose)
regular2=00ff66 #00ff66 (Neon Green)
regular3=ffaa00 #ffaa00 (Vibrant Amber)
regular4=0066ff #0066ff (Deep Neon Blue)
regular5=cc33ff #cc33ff (Electric Purple)
regular6=00f0ff #00f0ff (Vivid Cyan)
regular7=e0e0e0 #e0e0e0

# Bright colors (Max Radiance / Accent Highlights)
bright0=4d4d4d #4d4d4d
bright1=ff5e87 #ff5e87 (Laser Pink)
bright2=5eff9a #5eff9a (Bright Mint)
bright3=ffcc00 #ffcc00 (Pure Gold)
bright4=5ebbff #5ebbff (Sky Cyan)
bright5=df80ff #df80ff (Bright Orchid)
bright6=80f7ff #80f7ff (Ice Blue)
bright7=ffffff #ffffff

# Selection colors
selection-foreground=000000 #000000
selection-background=00f0ff #00f0ff

alpha = 0.85
cursor=1a1a1a 9fd5f5

[key-bindings]
scrollback-up-page=Control+b
scrollback-down-page=Control+f
scrollback-up-line=Control+k
scrollback-down-line=Control+j

[scrollback]
indicator-format=line

[mouse]
hide-when-typing=yes
